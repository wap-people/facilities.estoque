# Evita que o Supabase (plano gratuito) pause o projeto por inatividade.
# O plano free pausa após 7 dias sem uso; isto faz uma consulta leve a cada 3 dias.
# Usa a URL e a chave anon PÚBLICAS do config.js (a mesma que o site usa).
# Também pode ser rodado à mão: GitHub > Actions > "Supabase keep-alive" > Run workflow.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 11 */3 * *'   # a cada 3 dias, 08:17 (horário de Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Consulta leve no banco
        run: |
          URL=$(grep -o "SUPABASE_URL: *'[^']*'" config.js | sed "s/.*'\(.*\)'/\1/")
          KEY=$(grep -o "SUPABASE_ANON_KEY: *'[^']*'" config.js | sed "s/.*'\(.*\)'/\1/")
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/units?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "Tentativa $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::O Supabase não respondeu (HTTP $CODE). O projeto pode estar pausado: entre no painel do Supabase e clique em Resume project."
          exit 1
